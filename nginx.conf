server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
